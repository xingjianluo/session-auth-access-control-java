server.port=0

# 本地开发用签名密钥（非真实凭据）
auth.token-secret=local-dev-secret-not-for-production
# 访问令牌 / 刷新令牌有效期（秒）
auth.access-token-ttl-seconds=60
auth.refresh-token-ttl-seconds=600
# 登录失败频率限制：每窗口允许次数与窗口长度（秒）
auth.login-fail-limit=5
auth.login-fail-window-seconds=60
# 续期频率限制：每窗口允许次数与窗口长度（秒）
auth.refresh-limit=10
auth.refresh-window-seconds=60
